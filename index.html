<!doctype html>
<meta charset="utf-8">

<title>Spill Response Simulator</title>

<!--
  GitHub Pages entry point.
  The simulator itself lives in spill-simulator.html (kept as the single
  source of truth). This page forwards to it immediately so the site root
  loads the sim. Redirect is instant (0s) via meta-refresh + location.replace,
  with a manual link as a no-JS fallback.
-->
<meta http-equiv="refresh" content="0; url=./spill-simulator.html">
<link rel="canonical" href="./spill-simulator.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B3B2A'/%3E%3Cpath d='M16 6C11 14 9 17 9 21a7 7 0 0 0 14 0C23 17 21 14 16 6Z' fill='%238FBF6B'/%3E%3C/svg%3E">
<style>
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%, #24523a 0%, #1B3B2A 60%, #12271c 100%);
    color:#eaf1e2; display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .wrap{ opacity:.9; }
  .mark{ font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:#8FBF6B; font-weight:700; }
  h1{ font-size:26px; margin:10px 0 6px; }
  a{ color:#8FBF6B; font-weight:700; }
  .spin{
    width:34px; height:34px; margin:18px auto 0; border-radius:50%;
    border:3px solid rgba(143,191,107,.25); border-top-color:#8FBF6B;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
</style>
<body>
  <div class="wrap">
    <div class="mark">Erudithe Interactive Training</div>
    <h1>Spill Response Simulator</h1>
    <p>Loading… if this page does not forward automatically,
       <a href="./spill-simulator.html">open the simulator</a>.</p>
    <div class="spin"></div>
  </div>
  <script>location.replace('./spill-simulator.html');</script>
</body>
